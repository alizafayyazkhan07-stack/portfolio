<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Calculator</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #0b1020, #0f172a);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      padding: 20px;
    }

    .back-link {
      margin-bottom: 1.5rem;
      color: #38bdf8;
      text-decoration: none;
      font-size: 0.95rem;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 0.4rem 1rem;
      border-radius: 999px;
      transition: background 0.2s, color 0.2s;
    }

    .back-link:hover {
      background: #38bdf8;
      color: #0b1020;
    }

    .calculator {
      background: #1e293b;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 340px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    #display {
      width: 100%;
      height: 70px;
      text-align: right;
      font-size: 2.2rem;
      margin-bottom: 20px;
      padding: 12px 16px;
      border: none;
      border-radius: 14px;
      background: #0f172a;
      color: #f8fafc;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      padding: 18px;
      font-size: 1.25rem;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      background: #334155;
      color: #f8fafc;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    button:hover {
      background: #475569;
    }

    button:active {
      transform: scale(0.96);
    }

    button.operator {
      background: #0284c7;
      color: #fff;
    }

    button.operator:hover {
      background: #0369a1;
    }

    button.equals {
      background: #10b981;
      color: #fff;
      grid-row: span 2;
    }

    button.equals:hover {
      background: #059669;
    }

    button.zero {
      grid-column: span 2;
    }

    button.clear {
      background: #ef4444;
      color: #fff;
    }

    button.clear:hover {
      background: #dc2626;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-link">← Back to Portfolio</a>

  <div class="calculator">
    <input type="text" id="display" readonly placeholder="0" />
    <div class="buttons">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button class="operator" onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="appendOperator('/')">/</button>
      <button class="operator" onclick="appendOperator('*')">*</button>

      <button onclick="appendNumber('7')">7</button>
      <button onclick="appendNumber('8')">8</button>
      <button onclick="appendNumber('9')">9</button>
      <button class="operator" onclick="appendOperator('-')">-</button>

      <button onclick="appendNumber('4')">4</button>
      <button onclick="appendNumber('5')">5</button>
      <button onclick="appendNumber('6')">6</button>
      <button class="operator" onclick="appendOperator('+')">+</button>

      <button onclick="appendNumber('1')">1</button>
      <button onclick="appendNumber('2')">2</button>
      <button onclick="appendNumber('3')">3</button>
      <button class="equals" onclick="calculate()">=</button>

      <button onclick="appendNumber('0')" class="zero">0</button>
      <button onclick="appendNumber('.')">.</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function appendNumber(number) {
      if (display.value === '0' || display.value === 'Error') {
        display.value = number;
      } else {
        display.value += number;
      }
    }

    function appendOperator(operator) {
      if (display.value === 'Error' || display.value === '') return;
      const lastChar = display.value.slice(-1);
      if (['+', '-', '*', '/'].includes(lastChar)) {
        display.value = display.value.slice(0, -1) + operator;
      } else {
        display.value += operator;
      }
    }

    function clearDisplay() {
      display.value = '';
    }

    function deleteLast() {
      if (display.value === 'Error') {
        display.value = '';
      } else {
        display.value = display.value.slice(0, -1);
      }
    }

    function calculate() {
      if (!display.value || display.value === 'Error') return;
      try {
        // Evaluate mathematical expression safely
        const sanitized = display.value.replace(/[^0-9+\-*/.]/g, '');
        const result = Function(`'use strict'; return (${sanitized})`)();
        display.value = Number.isFinite(result) ? result : 'Error';
      } catch {
        display.value = 'Error';
      }
    }
  </script>
</body>
</html>
